[project]
name = "jev-trader"
version = "0.1.0"
description = "Block-speed market maker: math in code, judgment in Jev, final say in the risk engine. Paper trading only."
requires-python = ">=3.10"
dependencies = []  # core is stdlib-only; the SDK is imported lazily by TypeSafeBackend

[project.optional-dependencies]
jev = ["typesafe-sdk==0.7.2"]  # exact pin: response/retry semantics verified against this version
dev = ["pytest>=8", "typesafe-sdk==0.7.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
